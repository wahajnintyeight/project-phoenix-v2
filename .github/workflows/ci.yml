name: Build and Deploy (changed only)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild and deploy all enabled services
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # This job is intentionally deployment-only. Never execute fork or PR code
    # on the private self-hosted runner.
    if: >-
      github.repository == 'wahajnintyeight/project-phoenix-v2' &&
      github.actor == 'wahajnintyeight' &&
      github.triggering_actor == 'wahajnintyeight' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          token: ${{ github.token }}
          filters: |
            apigateway:
              - 'pkg/service/apigateway/**'
              - '.github/workflows/ci.yml'
              - 'pkg/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
            apigateway_grpc:
              - 'pkg/service/apigateway-grpc/**'
              - '.github/workflows/ci.yml'
              - 'pkg/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
            datacommunicator:
              - 'pkg/service/datacommunicator/**'
              - '.github/workflows/ci.yml'
              - 'pkg/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
            locationservice:
              - 'pkg/service/locationservice/**'
              - '.github/workflows/ci.yml'
              - 'pkg/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
            socketservice:
              - 'pkg/service/socketservice/**'
              - '.github/workflows/ci.yml'
              - 'pkg/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
            sse_service:
              - 'pkg/service/sse-service/**'
              - '.github/workflows/ci.yml'
              - 'pkg/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
            worker_service:
              - 'pkg/service/worker-service/**'
              - '.github/workflows/ci.yml'
              - 'pkg/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
            scraper_service:
              - 'pkg/service/scraper-service/**'
              - '.github/workflows/ci.yml'
              - 'pkg/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'

      - name: Set up QEMU & Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Prepare Go modules (tidy and vendor)
        run: |
          go env -w GOPROXY=https://proxy.golang.org,direct
          go mod tidy
          go mod vendor

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute targets
        id: list
        run: |
          # Map filters to service folder names
          changed=()
          force_rebuild='${{ inputs.force_rebuild || false }}'

          if [ "$force_rebuild" = "true" ]; then
             changed+=(
               "pkg/service/apigateway"
               "pkg/service/apigateway-grpc"
               "pkg/service/socketservice"
               "pkg/service/sse-service"
               "pkg/service/worker-service"
               "pkg/service/scraper-service"
             )
          else
             [ "${{ steps.changes.outputs.apigateway }}" = "true" ] && changed+=("pkg/service/apigateway")
             [ "${{ steps.changes.outputs.apigateway_grpc }}" = "true" ] && changed+=("pkg/service/apigateway-grpc")
             [ "${{ steps.changes.outputs.socketservice }}" = "true" ] && changed+=("pkg/service/socketservice")
             [ "${{ steps.changes.outputs.sse_service }}" = "true" ] && changed+=("pkg/service/sse-service")
             [ "${{ steps.changes.outputs.worker_service }}" = "true" ] && changed+=("pkg/service/worker-service")
             [ "${{ steps.changes.outputs.scraper_service }}" = "true" ] && changed+=("pkg/service/scraper-service")
          fi

          echo "Detected targets: ${changed[*]:-none}"
          
          if [ ${#changed[@]} -eq 0 ]; then
             echo "none=true" >> $GITHUB_OUTPUT
          else
             echo "paths=${changed[*]}" >> $GITHUB_OUTPUT
             echo "none=false" >> $GITHUB_OUTPUT
          fi

      - name: Build changed
        if: steps.list.outputs.none == 'false'
        run: |
          IFS=' ' read -r -a paths <<< "${{ steps.list.outputs.paths }}"
          for path in "${paths[@]}"; do
            # Extract service name (e.g., 'pkg/service/apigateway' -> 'apigateway')
            svc_name=$(basename "$path")
            
            echo "Building $svc_name from $path"
            
            # Point to the specific Dockerfile inside the service folder
            docker buildx build \
              --file "$path/Dockerfile" \
              --build-arg SERVICE_PATH="$path" \
              --platform linux/amd64 \
              --tag "ghcr.io/${{ github.repository_owner }}/$svc_name:latest" \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              $([ "${{ github.event_name }}" != "pull_request" ] && echo "--push") \
              .
          done

      - name: Deploy to VPS
        if: steps.list.outputs.none == 'false'
        uses: appleboy/ssh-action@v1.2.0
        env:
          PATHS: "${{ steps.list.outputs.paths }}"
          BRANCH: "${{ github.ref_name }}"
          GHCR_TOKEN: "${{ secrets.PAT }}"
          USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: PATHS,BRANCH,GHCR_TOKEN,USER
          script: |
            set -e
            cd /var/www/project-phoenix-v2
            
            git pull --ff-only origin "$BRANCH"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$USER" --password-stdin

            IFS=' ' read -r -a paths <<< "$PATHS"
            deploy_targets=()
            
            for path in "${paths[@]}"; do
              svc=$(basename "$path")
              case "$svc" in
                apigateway)       deploy_targets+=("api-gateway") ;;
                apigateway-grpc)  deploy_targets+=("api-gateway-grpc") ;;
                socketservice)    deploy_targets+=("socket-service") ;;
                sse-service)      deploy_targets+=("sse-service") ;;
                worker-service)   deploy_targets+=("worker-service") ;;
                scraper-service)  deploy_targets+=("scraper-service") ;;
              esac
            done

            if [ ${#deploy_targets[@]} -gt 0 ]; then
               echo "Starting zero-downtime rolling update for: ${deploy_targets[*]}"

               # Pull fresh images (other services keep running)
               docker compose -p project-phoenix-v2 pull "${deploy_targets[@]}"
               
               # Rolling restart: restart only changed services, one at a time if needed
               for target in "${deploy_targets[@]}"; do
                 echo "Restarting $target..."
                 docker compose -p project-phoenix-v2 up -d --no-deps --wait "$target"
               done
               
               echo "All services updated"
               docker compose -p project-phoenix-v2 ps
               
               # Cleanup old images only for ppv2 services
               docker images -a ghcr.io/wahajnintyeight/* | grep '<none>' | awk '{print $3}' | sort -u | xargs -r docker rmi -f 2>/dev/null || true
            fi
